version: '3.8'

services:
  balance-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balance-app
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - balance-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  balance-network:
    driver: bridge
